set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

########## BINDINGS ##########

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix


bind ^X lock-server
bind ^C new-window -c "$HOME"
bind n new-window
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind x kill-pane
# bind c swap-pane -D
bind S choose-session
bind-key -T copy-mode-vi v send-keys -X begin-selection

##############################

########## PLUGINS ##########
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
#############################


######### TMUX MODE #######
# prompt to display when tmux prefix key is pressed
set -g @mode_indicator_prefix_prompt '   '

# prompt to display when tmux is in copy mode
set -g @mode_indicator_copy_prompt ' 󰝤  '

# prompt to display when tmux has synchronized panes
set -g @mode_indicator_sync_prompt '   '

# prompt to display when tmux is in normal mode
set -g @mode_indicator_empty_prompt ' 󰔶  '

# style values for prefix prompt
set -g @mode_indicator_prefix_mode_style 'bg=default,fg=blue'

# style values for copy prompt
set -g @mode_indicator_copy_mode_style 'bg=default,fg=white'

# style values for sync prompt
set -g @mode_indicator_sync_mode_style 'bg=default,fg=green'

# style values for empty prompt
set -g @mode_indicator_empty_mode_style 'bg=default,fg=red'
###########################

########## STATUS SETTING ##########

set -g status-justify absolute-centre

set -g status-left-length 50  # Increase this value if needed
set -g status-left ' [#{tmux_mode_indicator}] [ #[fg=yellow]#S #[default]]'
set -g status-right ''


set -g window-status-format ' #I | #W '
set -g window-status-current-format '#[bg=default,fg=blue] #I #[bg=default,fg=pink]| #[bg=default,fg=red]#W '

########## PLUGIN SETTINGS ##########

# resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# continuum
set -g @continuum-restore 'on'

# image view
set -gq allow-passthrough on
set -g visual-activity off
# floax
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'

# sessionx
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'

#fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

#####################################


# Initialize TMUX plugin manager 
run '~/.tmux/plugins/tpm/tpm'



# force transparent status bg
set -g status-bg default
set -g status-style bg=default

